version: '3.8'

services:
  # NestJS Application
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_USERNAME=quest_user
      - DATABASE_PASSWORD=quest_password
      - DATABASE_NAME=quest_db
      - MONGODB_URI=mongodb://mongo:27017/quest_mongo
    depends_on:
      - mysql
      - mongo
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quest_db
      MYSQL_USER: quest_user
      MYSQL_PASSWORD: quest_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # MongoDB Database
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: